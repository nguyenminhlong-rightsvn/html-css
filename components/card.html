<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Card</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="/styles/card.css" />
  </head>
  <body class="card-page">
    <div class="card">
      <div class="card-media">
        <img
          class="card-image"
          src="../images/snickers.jpg"
          alt="Giày Nike Snickers Off-White"
        />
      </div>

      <div class="card-body">
        <div class="card-info">
          <h2 class="card-name">Snickers Off-White<br />2024</h2>
          <p class="card-brand">NIKE</p>
          <p class="card-price">$38.00</p>
        </div>

        <button class="card-add" type="button" aria-label="Thêm vào giỏ hàng">
          +
        </button>
      </div>
    </div>
  </body>
</html>
